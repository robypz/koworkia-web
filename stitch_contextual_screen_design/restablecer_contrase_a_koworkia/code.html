<main class="w-full max-w-[480px]">
<!-- Error Banner -->

<span class="material-symbols-outlined" data-icon="error">error</span>
<span class="font-body-sm">El enlace ha expirado. Por favor, solicita uno nuevo.</span>
</div>
<!-- Auth Card -->

<!-- Logo Placeholder -->

</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-lg">Nueva contraseña</h1>
<form class="flex flex-col gap-md text-left">
<!-- Email Field (Read Only) -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email</label>
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-low text-on-surface-variant px-sm py-sm font-body-md focus:outline-none cursor-not-allowed" disabled="" id="email" readonly="" type="email" value="usuario@ejemplo.com"/>
</div>
<!-- New Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="new_password">Nueva contraseña</label>
<div class="relative">
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-sm py-sm font-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all" id="new_password" placeholder="Ingresa tu nueva contraseña" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="confirm_password">Confirmar nueva contraseña</label>
<div class="relative">
<input class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-sm py-sm font-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all" id="confirm_password" placeholder="Repite tu nueva contraseña" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-md w-full bg-primary-container text-on-primary rounded-lg py-sm px-md font-label-md text-label-md hover:bg-primary transition-colors duration-200 flex items-center justify-center gap-sm shadow-sm hover:shadow-md" type="submit">
                Restablecer contraseña
            </button>
</form>
<div class="mt-lg">
<a class="font-body-sm text-primary hover:text-primary-container transition-colors" href="#">Volver al inicio de sesión</a>
</div>
