<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<!-- Main Container -->
<main class="w-full max-w-[480px]">
<!-- Auth Card -->
<div class="bg-surface-container-lowest rounded-lg shadow-md p-xl flex flex-col items-center">
<!-- Logo -->
<div class="mb-lg w-full flex justify-center">
<img alt="Koworkia Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRZ0zwDgrPkhPKMr8wqR_Ygc1rL9THORdO-YAwtJ95fj0UDAgBXrOfB6Y4IPO_zeddNzjc3PEZ3osMkM_HXCUn7CPJV14Il-nvxlSfl1_vdr0PB0EqO6YgeBlp5A9FoeiR1DOKNN_ayMZP1Z6_aNoZXn7IQmf_D1ytgW9_MUDK1emvaB7mlFiUuaBIpbFRHxNWepc9VOkq8BWCxdQCWFTlHmjH3OswtLSC4ikMse_hhBByznvkK2e6ajyqVyks3-aBPsQ"/>
</div>
<!-- Title & Subtitle -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Recuperar Acceso</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Introduce tu email y te enviaremos un enlace para recuperar tu acceso.
                </p>
</div>
<!-- Success Message (Hidden by default, can be toggled via JS) -->
<div class="hidden w-full bg-tertiary-container text-on-tertiary-container rounded-lg p-sm mb-lg flex items-start gap-sm shadow-sm transition-opacity duration-300" id="success-message">
<span class="material-symbols-outlined shrink-0 text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<p class="font-body-sm text-body-sm flex-1 pt-[2px]">
                    Si el correo existe, recibirás un enlace en breve.
                </p>
</div>
<!-- Form -->
<form class="w-full flex flex-col gap-lg" id="recovery-form" onsubmit="handleRecovery(event)">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">mail</span>
<input class="w-full pl-10 pr-sm py-sm rounded-lg border border-outline bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none transition-colors duration-200" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-label-md text-label-md py-sm px-lg rounded-lg flex items-center justify-center gap-sm hover:brightness-95 active:brightness-90 transition-all duration-200 shadow-sm mt-sm" type="submit">
                    Enviar enlace de recuperación
                    <span class="material-symbols-outlined text-[20px]">send</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-lg w-full text-center">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container flex items-center justify-center gap-xs transition-colors duration-200" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Volver a iniciar sesión
                </a>
</div>

</footer>
</main>
<script>
        function handleRecovery(event) {
            event.preventDefault(); // Prevent actual form submission for demo
            
            const form = document.getElementById('recovery-form');
            const submitBtn = form.querySelector('button[type="submit"]');
            const successMsg = document.getElementById('success-message');
            
            // Simulate loading state
            const originalContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> Enviando...`;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

            // Simulate API call delay
            setTimeout(() => {
                // Show success message
                successMsg.classList.remove('hidden');
                
                // Reset button
                submitBtn.innerHTML = originalContent;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                
                // Clear input
                document.getElementById('email').value = '';
                
            }, 1500);
        }
    </script>
