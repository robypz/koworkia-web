<body class="bg-background min-h-screen text-on-surface font-body-md overflow-hidden antialiased">
<!-- Mock Dashboard Background (Blurred out by overlay) -->
<div class="absolute inset-0 bg-dashboard-placeholder w-full h-full pointer-events-none" data-alt="A modern SaaS dashboard interface for a coworking space management system. Light mode aesthetic with crisp white widgets, subtle gray borders, and a sidebar. The layout is clean and professional, featuring abstract data charts and user profiles in a well-organized grid structure. Soft, uniform lighting.">
<div class="flex h-full w-full">
<div class="w-64 border-r border-outline-variant bg-surface-container-low hidden md:block"></div>
<div class="flex-1 p-margin-desktop opacity-50">
<div class="h-24 w-full bg-surface-container rounded-lg mb-lg"></div>
<div class="grid grid-cols-3 gap-gutter h-64">
<div class="bg-surface-container rounded-lg"></div>
<div class="bg-surface-container rounded-lg"></div>
<div class="bg-surface-container rounded-lg"></div>
</div>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-50 flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Modal Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-md w-full max-w-md p-xl relative transform transition-all duration-300 scale-100 opacity-100">
<!-- Close Button (Icon) -->
<button class="absolute top-md right-md text-on-surface-variant hover:text-on-surface transition-colors p-xs rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Modal Content -->
<div class="flex flex-col items-center text-center mb-lg">
<div class="w-12 h-12 rounded-full bg-error-container/20 text-error flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="lock" data-weight="fill">lock</span>
</div>
<h2 class="font-title-lg text-title-lg text-on-surface mb-xs">Confirma tu contraseña para continuar</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Por seguridad, introduce tu contraseña antes de realizar cambios sensibles</p>
</div>
<!-- Form -->
<form class="space-y-lg">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="key">key</span>
<input class="w-full pl-[40px] pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm outline-none font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col-reverse sm:flex-row justify-end gap-md pt-xs">
<button class="px-lg py-sm rounded-lg border border-outline text-on-surface font-label-md text-label-md hover:bg-surface-variant transition-colors duration-200" type="button">
                        Cancelar
                    </button>
<button class="px-lg py-sm rounded-lg bg-secondary-container text-on-secondary-container font-label-md text-label-md hover:brightness-95 transition-all duration-200 shadow-sm flex justify-center items-center" type="submit">
                        Confirmar
                    </button>
</div>
</form>
