<body class="h-full flex items-center justify-center bg-background text-on-background selection:bg-primary-container selection:text-on-primary-container">

<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                    Iniciar sesión
                </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs text-center">
                    Accede a tu espacio de coworking
                </p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault(); document.getElementById('error-message').classList.remove('hidden');">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-md shadow-sm focus:ring-2 focus:ring-primary-container focus:border-primary-container placeholder:text-outline-variant transition-colors duration-200" id="email" name="email" placeholder="ejemplo@correo.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Contraseña</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-xl pr-xl py-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-md shadow-sm focus:ring-2 focus:ring-primary-container focus:border-primary-container placeholder:text-outline-variant transition-colors duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary-container transition-colors duration-200 focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container focus:ring-primary-container border-outline-variant rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                            Recordarme
                        </label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-primary-container hover:text-on-primary-fixed-variant transition-colors duration-200" href="#">
                            ¿Olvidaste tu contraseña?
                        </a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-[#1d4ed8] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all duration-200 active:scale-[0.98]" type="submit">
                        Iniciar sesión
                    </button>
</div>
<div class="hidden flex items-center gap-xs p-sm rounded-md bg-error-container text-on-error-container" id="error-message">
<span class="material-symbols-outlined text-[20px]" data-icon="error">error</span>

</a>
</div>
</div>

</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
