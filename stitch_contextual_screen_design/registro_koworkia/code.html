<body class="h-full flex items-center justify-center bg-surface-container-highest p-margin-mobile md:p-margin-desktop text-on-surface">
<main class="w-full max-w-[480px]">
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-lg shadow-md p-xl flex flex-col gap-lg">
<!-- Logo & Header -->
<div class="flex flex-col items-center gap-md text-center">
<img alt="Koworkia Logo" class="h-16 w-auto object-contain rounded" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAaVm5ZZULhjiuRc1tsB6Ry8Elb5elwaZljgXd_SXcIGhe89Ne5jxG7hqZd7D66woXvgashAWCKy4_3U9dxpOKu0rz9O9-kLbIlMfoSjlh-F5uKlglX63zfM86yYYcDin3yEpu0XdkM1PjUENiTiqq5DH5WCPye9KddUJ7gvdJos0-iXNKMJ2xTpp8oNrLMdIskLe5JN0MHpXdTFK-xRiQN0bg-PT3dyCnkIToGZ1zOizNRke5cf4gMdmpVAJyeamlJlOI"/>
<h1 class="font-headline-md text-headline-md text-on-surface">Crear cuenta</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Únete a nuestra comunidad de coworking</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); showLoading(this);">
<!-- Full Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Nombre completo</label>
<input class="w-full h-[48px] rounded-lg border border-outline-variant bg-surface-container-lowest px-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none" id="fullName" name="fullName" placeholder="Ej. Ana Martínez" type="text"/>
</div>
<!-- Email Field (with error state) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative w-full">
<input class="w-full h-[48px] rounded-lg border border-error bg-error-container/10 px-sm font-body-md text-body-md text-on-surface focus:border-error focus:ring-2 focus:ring-error/20 transition-all duration-200 outline-none pr-10" id="email" name="email" type="email" value="correo_invalido"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-error" data-icon="error">error</span>
</div>
<p class="font-label-sm text-label-sm text-error mt-1">El email no es válido</p>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<input class="w-full h-[48px] rounded-lg border border-outline-variant bg-surface-container-lowest px-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none" id="password" name="password" oninput="updatePasswordStrength(this.value)" placeholder="Mínimo 8 caracteres" type="password"/>
<!-- Password Strength Indicator -->
<div class="flex items-center justify-between mt-2">
<div class="flex-1 flex gap-1 h-1.5 mr-3">
<div class="h-full w-full rounded-full bg-tertiary-fixed-dim"></div>
<div class="h-full w-full rounded-full bg-tertiary-fixed-dim"></div>
<div class="h-full w-full rounded-full bg-tertiary-fixed-dim"></div>
<div class="h-full w-full rounded-full bg-surface-variant"></div>
</div>
<span class="font-label-sm text-label-sm text-tertiary">Fuerte</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Confirmar contraseña</label>
<input class="w-full h-[48px] rounded-lg border border-outline-variant bg-surface-container-lowest px-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" type="password"/>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full h-[48px] rounded-lg bg-[#2563eb] text-white font-label-md text-label-md flex items-center justify-center gap-2 hover:brightness-95 active:scale-[0.98] transition-all duration-200 relative overflow-hidden shadow-sm" id="submitBtn" type="submit">
<span id="btnText">Crear cuenta</span>
<span class="material-symbols-outlined animate-spin-slow hidden absolute" data-icon="progress_activity" id="btnSpinner">progress_activity</span>
</button>
</form>
<!-- Login Link -->
<div class="text-center mt-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    ¿Ya tienes cuenta? 
                    <a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Inicia sesión</a>
</p>

</main>
<script>
        function showLoading(form) {
            const btn = document.getElementById('submitBtn');
            const text = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            
            // Disable button
            btn.disabled = true;
            btn.classList.add('opacity-90');
            
            // Hide text, show spinner
            text.classList.add('invisible');
            spinner.classList.remove('hidden');

            // Simulate network request
            setTimeout(() => {
                // Reset (just for demo purposes)
                btn.disabled = false;
                btn.classList.remove('opacity-90');
                text.classList.remove('invisible');
                spinner.classList.add('hidden');
                
                // Usually would redirect here
                console.log('Registration simulated');
            }, 2000);
        }

        // Placeholder for dynamic password strength (visual only based on prompt)
        function updatePasswordStrength(value) {
            // Logic would go here in a real app, currently static 'Fuerte' per requirements
        }
    </script>
