<div class="flex h-screen overflow-hidden bg-bg-surface text-on-surface">
  <!-- SideNavBar -->
  <aside class="fixed top-0 left-0 z-20 hidden h-full w-[260px] flex-col bg-on-surface py-6 shadow-md md:flex">
    <div class="mb-8 flex items-center gap-3 px-6">
      <span class="material-symbols-outlined text-4xl text-primary-container" style="font-variation-settings: 'FILL' 1">crop_free</span>
      <div>
        <h1 class="font-display text-xl font-bold tracking-tight text-surface">Koworkia</h1>
        <p class="mt-1 text-[10px] font-medium tracking-widest text-surface-variant uppercase opacity-80">
          Manage. Connect. Grow.
        </p>
      </div>
    </div>
    <nav class="flex flex-1 flex-col gap-1 px-4">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-primary-container text-on-primary-container shadow-md"
          [routerLinkActiveOptions]="{ exact: false }"
          class="mx-2 my-1 flex items-center gap-3 rounded-lg px-4 py-3 text-surface-variant transition-all duration-200 hover:bg-white/5 hover:text-surface"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span class="text-sm font-medium">{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex h-full w-full flex-1 flex-col md:ml-[260px]">
    <!-- TopAppBar -->
    <header class="z-10 flex h-16 w-full items-center justify-between border-b border-surface-variant bg-surface px-4 md:px-8">
      <h2 class="font-display text-lg font-semibold text-primary md:text-xl">{{ currentTitle() }}</h2>
      <div class="flex items-center gap-4">
        <div class="hidden text-right sm:block">
          <p class="text-sm font-semibold text-primary">{{ user()?.name }}</p>
        </div>
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary-container text-xs font-bold text-on-primary-container">
          {{ initials() }}
        </div>
        <button
          type="button"
          class="rounded-full p-2 text-on-surface-variant transition-colors hover:bg-surface-container-low"
          title="Cerrar sesión"
          (click)="logout()"
        >
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-4 pb-24 md:p-8 md:pb-8">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="fixed bottom-0 z-30 flex w-full justify-around border-t border-surface-variant bg-surface py-3 md:hidden">
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="text-primary"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex flex-col items-center text-on-surface-variant"
      >
        <span class="material-symbols-outlined mb-1">{{ item.icon }}</span>
        <span class="text-[10px] font-medium">{{ item.label }}</span>
      </a>
    }
  </nav>
</div>

<app-toast />
<app-confirm-dialog />
