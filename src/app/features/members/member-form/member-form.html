<app-modal [open]="true" [title]="isEdit() ? 'Editar miembro' : 'Nuevo miembro'" (closed)="cancel.emit()">
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label class="mb-1 block text-sm font-medium text-on-surface" for="name">Nombre completo</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Ej. Ana García"
        class="w-full rounded-md border border-outline-variant px-3 py-2 text-sm text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-on-surface" for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="ejemplo@correo.com"
        class="w-full rounded-md border border-outline-variant px-3 py-2 text-sm text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-on-surface" for="phone">Teléfono</label>
      <input
        id="phone"
        type="tel"
        formControlName="phone"
        placeholder="Opcional"
        class="w-full rounded-md border border-outline-variant px-3 py-2 text-sm text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-on-surface" for="plan_id">Plan</label>
      <select
        id="plan_id"
        formControlName="plan_id"
        class="w-full rounded-md border border-outline-variant bg-surface-container-lowest px-3 py-2 text-sm text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none"
      >
        <option [ngValue]="null">Sin plan</option>
        @for (plan of plans(); track plan.id) {
          <option [ngValue]="plan.id">{{ plan.name }}</option>
        }
      </select>
    </div>

    @if (!isEdit()) {
      <div>
        <label class="mb-1 block text-sm font-medium text-on-surface" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
          class="w-full rounded-md border border-outline-variant px-3 py-2 text-sm text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 focus:outline-none"
        />
      </div>
    }

    <div class="mt-2 flex justify-end gap-3">
      <button
        type="button"
        class="rounded-lg border border-outline px-4 py-2 text-sm font-medium text-on-surface transition-colors hover:bg-surface-variant"
        (click)="cancel.emit()"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="saving()"
        class="rounded-lg bg-primary-container px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-primary-container/90 disabled:opacity-70"
      >
        Guardar
      </button>
    </div>
  </form>
</app-modal>
