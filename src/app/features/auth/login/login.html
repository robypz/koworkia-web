<main class="flex min-h-screen w-full items-center justify-center bg-surface p-4">
  <div class="w-full max-w-md rounded-lg border border-surface-variant/50 bg-surface-container-lowest p-8 shadow-md">
    <div class="mb-6 flex flex-col items-center">
      <span class="material-symbols-outlined mb-2 text-5xl text-primary-container" style="font-variation-settings: 'FILL' 1">crop_free</span>
      <h1 class="font-display text-2xl font-semibold text-on-surface">Iniciar sesión</h1>
      <p class="mt-1 text-center text-sm text-on-surface-variant">Accede a tu espacio de coworking</p>
    </div>

    <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="mb-1 block text-sm font-medium text-on-surface" for="email">Email</label>
        <div class="relative">
          <span class="material-symbols-outlined pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-[20px] text-outline">mail</span>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            class="block w-full rounded-md border border-outline-variant bg-surface-container-lowest py-2 pr-3 pl-10 text-sm text-on-surface shadow-sm transition-colors placeholder:text-outline-variant focus:border-primary-container focus:ring-2 focus:ring-primary-container focus:outline-none"
          />
        </div>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-on-surface" for="password">Contraseña</label>
        <div class="relative">
          <span class="material-symbols-outlined pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-[20px] text-outline">lock</span>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            class="block w-full rounded-md border border-outline-variant bg-surface-container-lowest py-2 pr-10 pl-10 text-sm text-on-surface shadow-sm transition-colors placeholder:text-outline-variant focus:border-primary-container focus:ring-2 focus:ring-primary-container focus:outline-none"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-outline transition-colors hover:text-primary-container focus:outline-none"
            (click)="togglePassword()"
          >
            <span class="material-symbols-outlined text-[20px]">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex w-full items-center justify-center gap-2 rounded-lg border border-transparent bg-primary-container px-4 py-2.5 text-sm font-medium text-on-primary shadow-sm transition-all duration-200 hover:bg-[#1d4ed8] focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:outline-none active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-70"
        >
          @if (submitting()) {
            <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
          }
          Iniciar sesión
        </button>
      </div>

      @if (loginError()) {
        <div class="flex items-center gap-2 rounded-md bg-error-container p-3 text-on-error-container">
          <span class="material-symbols-outlined text-[20px]">error</span>
          <p class="text-sm">Credenciales inválidas. Por favor, inténtalo de nuevo.</p>
        </div>
      }
    </form>
  </div>
</main>
